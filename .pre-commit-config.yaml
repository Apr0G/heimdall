# Pre-commit hooks for Heimdall.
#   Secrets:           gitleaks, unscoped — a leaked credential in ANY file type
#                      (tf, md, json, env) is the one mistake that can't be undone
#                      by a follow-up commit, so this runs before the linters.
#   Backend (Python): ruff (lint, autofix) + black (format), scoped to backend/.
#   Frontend (TS):     eslint via the Next.js project's own flat config.
# Enable once with `pre-commit install`; run on demand with
# `pre-commit run --all-files`. Revs are pinned via `pre-commit autoupdate`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|scripts)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(backend|scripts)/
        # MUST match [tool.black] in backend/pyproject.toml, which CI enforces
        # via `cd backend && black --check .`.
        #
        # Without this the two disagree and actively fight: black resolves config
        # from the common parent of the files it is given, and because this hook
        # spans BOTH backend/ and scripts/ that parent is the repo root — which has
        # no [tool.black]. So the hook silently formatted at black's default 88
        # columns while CI demanded 100, meaning every commit reformatted the tree
        # one way and every CI run failed asking for the other.
        args: ["--line-length=100"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false
      - id: vitest
        name: vitest (frontend)
        entry: bash -c 'cd frontend && npm test -- --reporter=dot'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
