name: deploy-backend

# Builds the backend image, pushes it to ECR, and redeploys the ECS Express
# service so it pulls the new image. Runs automatically on backend changes to
# main, or manually. Uses GitHub OIDC — no AWS keys stored in GitHub.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Gate: a broken image must never reach production. Deploy needs this to pass.
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration tests. Without TEST_DATABASE_URL
    # they skip, so the concurrency guarantees would go unverified — the claim
    # race and the updated_at trigger cannot be tested any other way.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heimdall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable, with dev tools)
        working-directory: backend
        # Editable so the installed `app` points at the source tree — otherwise a
        # second copy lands in site-packages and pytest hits an import-file mismatch.
        run: pip install -e '.[dev]'
      - name: Lint, format check, tests
        working-directory: backend
        env:
          # Integration tests run migrations against this and speak no TLS (the
          # service container has no certificate); the app engine is untouched.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/heimdall_test
          # Synthetic, for migration 0007's role creation. Alphanumeric — the
          # migration rejects anything else. Never a real credential.
          APP_DB_PASSWORD: citestonlynotarealsecret
        run: |
          ruff check .
          black --check .
          pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: heimdall-backend
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPO:latest" -t "$REGISTRY/$REPO:$SHA" backend
          docker push "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$SHA"

      - name: Redeploy the ECS Express service
        run: |
          aws ecs update-service \
            --cluster default \
            --service heimdall-api \
            --force-new-deployment \
            --query 'service.serviceName' --output text
