name: deploy-backend

# Ships the backend to production. MANUAL ONLY — pushing to main no longer
# deploys. Tests still run automatically on every push (test-backend.yml); this
# workflow re-runs them and then requires a human to decide the moment.
#
# Why manual: a commit is cheap and revertible, a deploy touching PHI is neither,
# and HIPAA change control expects a record of who released what and when. This
# run's actor and timestamp are that record.
#
# Uses GitHub OIDC — no AWS keys stored in GitHub. NOTE: the IAM trust policy
# pins sub = repo:<repo>:ref:refs/heads/main (ecs-express.tf), so this must be
# dispatched from main. Adding a GitHub `environment:` here would change the sub
# claim to ...:environment:<name> and break the role assumption until the
# terraform trust policy is updated to match.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm shipping to production'
        required: true
        default: ""
      reason:
        description: "Why are you deploying? (recorded in the run log)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Type 'deploy' in the confirm box to ship to production. Got: '$CONFIRM'"
            exit 1
          fi
          echo "Deploy authorised by ${{ github.actor }} at $(date -u +%FT%TZ)"
          echo "Reason: ${REASON:-(none given)}"

  # Never ship untested code, even manually.
  test:
    needs: confirm
    uses: ./.github/workflows/test-backend.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: heimdall-backend
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPO:latest" -t "$REGISTRY/$REPO:$SHA" backend
          docker push "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$SHA"

      - name: Redeploy the ECS Express service
        run: |
          aws ecs update-service \
            --cluster default \
            --service heimdall-api \
            --force-new-deployment \
            --query 'service.serviceName' --output text

      # update-service returns the moment ECS accepts the request, which is why a
      # crashed task used to roll back while this workflow still went green (it
      # hid the RDS CA bundle crash for a day on 2026-07-13). Everything below
      # exists so a green check means "it is actually running".
      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable --cluster default --services heimdall-api

      - name: Verify the rollout completed and did not roll back
        run: |
          STATE=$(aws ecs describe-services --cluster default --services heimdall-api \
            --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' --output text)
          RUNNING=$(aws ecs describe-services --cluster default --services heimdall-api \
            --query 'services[0].deployments[?status==`PRIMARY`].runningCount' --output text)
          echo "rolloutState=$STATE runningCount=$RUNNING"
          if [ "$STATE" != "COMPLETED" ] || [ "$RUNNING" -lt 1 ]; then
            echo "::error::Deployment did not complete (state=$STATE running=$RUNNING). Recent events:"
            aws ecs describe-services --cluster default --services heimdall-api \
              --query 'services[0].events[0:10].message' --output text
            exit 1
          fi

      - name: Probe the live API
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://api.heimdallclaims.com/healthz)
          echo "healthz=$CODE"
          [ "$CODE" = "200" ] || { echo "::error::Health probe returned $CODE"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- actor: @${{ github.actor }}"
            echo "- verified: ECS rollout COMPLETED, task running, /healthz 200"
          } >> "$GITHUB_STEP_SUMMARY"
