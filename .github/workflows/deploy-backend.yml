name: deploy-backend

# Ships the backend to production. MANUAL ONLY — pushing to main no longer
# deploys. Tests still run automatically on every push (test-backend.yml); this
# workflow re-runs them and then requires a human to decide the moment.
#
# Why manual: a commit is cheap and revertible, a deploy touching PHI is neither,
# and HIPAA change control expects a record of who released what and when. This
# run's actor and timestamp are that record.
#
# Uses GitHub OIDC — no AWS keys stored in GitHub. NOTE: the IAM trust policy
# pins sub = repo:<repo>:ref:refs/heads/main (ecs-express.tf), so this must be
# dispatched from main. Adding a GitHub `environment:` here would change the sub
# claim to ...:environment:<name> and break the role assumption until the
# terraform trust policy is updated to match.
#
# ── SHIPPING A SCHEMA MIGRATION ──────────────────────────────────────────────
# Code that REQUIRES a new column must not reach the service before the
# migration that creates it. /healthz does not touch the database, so ECS would
# happily keep such a task running and green while every authenticated request
# 500s — it will not roll back for you.
#
# But `migrate-db` runs the `heimdall-migrate` task definition, which is pinned
# to `:latest` — so the migration can only run once the new image IS `:latest`.
# Pushing and restarting in one step made those two requirements contradictory.
#
# Hence the `mode` input. For a migration, run this three times:
#
#   1. mode=build-only      push the image; the service keeps running old code
#   2. (run the migrate-db workflow)
#   3. mode=deploy-only     restart onto the image from step 1
#
# For an ordinary deploy with no migration, leave mode=build-and-deploy.
#
# Residual risk in the gap between 1 and 2: `:latest` is already the new image,
# so an UNPLANNED task restart (crash, AZ rebalance) in those ~3 minutes would
# pull code that needs the not-yet-applied schema. That is a small, unlikely
# window versus a guaranteed multi-minute outage the other way round — but it is
# why steps 1 and 2 should be run back to back, not left overnight.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm shipping to production'
        required: true
        default: ""
      mode:
        description: "build-and-deploy = normal. build-only = push image, do NOT restart (use before a migration). deploy-only = restart on the image already in ECR."
        type: choice
        options:
          - build-and-deploy
          - build-only
          - deploy-only
        default: build-and-deploy
      reason:
        description: "Why are you deploying? (recorded in the run log)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REASON: ${{ inputs.reason }}
          MODE: ${{ inputs.mode }}
        run: |
          # Every mode requires the confirmation, build-only included: pushing
          # `:latest` means the next task restart — planned or not — picks the new
          # image up. It is a production change even when nothing restarts today.
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Type 'deploy' in the confirm box to ship to production. Got: '$CONFIRM'"
            exit 1
          fi
          echo "Mode: $MODE"
          echo "Deploy authorised by ${{ github.actor }} at $(date -u +%FT%TZ)"
          echo "Reason: ${REASON:-(none given)}"

  # Never ship untested code, even manually.
  test:
    needs: confirm
    uses: ./.github/workflows/test-backend.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Build and push image
        if: inputs.mode != 'deploy-only'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: heimdall-backend
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPO:latest" -t "$REGISTRY/$REPO:$SHA" backend
          docker push "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$SHA"

      # deploy-only ships whatever is already tagged :latest. Record which image
      # that actually is, so the run log is not silently ambiguous about what went
      # live — the workflow's own SHA is NOT necessarily the image's.
      #
      # Uses BatchGetImage, which the deploy role already holds for pulling.
      # DescribeImages would also give the push timestamp, but it is not granted,
      # and a *reporting* step must not be the thing that requires a new IAM
      # permission before a deploy can proceed.
      #
      # continue-on-error for the same reason: this step exists to annotate the
      # log. If it ever fails it must not block the rollout.
      - name: Report the image about to be deployed
        if: inputs.mode == 'deploy-only'
        continue-on-error: true
        run: |
          aws ecr batch-get-image --repository-name heimdall-backend \
            --image-ids imageTag=latest \
            --query 'images[0].imageId' --output table

      - name: Redeploy the ECS Express service
        if: inputs.mode != 'build-only'
        run: |
          aws ecs update-service \
            --cluster default \
            --service heimdall-api \
            --force-new-deployment \
            --query 'service.serviceName' --output text

      # update-service returns the moment ECS accepts the request, which is why a
      # crashed task used to roll back while this workflow still went green (it
      # hid the RDS CA bundle crash for a day on 2026-07-13). Everything below
      # exists so a green check means "it is actually running".
      - name: Wait for the service to stabilise
        if: inputs.mode != 'build-only'
        run: |
          # The waiter hard-caps at 40x15s = 10 minutes, but a healthy rollout can
          # take longer than that: new task startup plus the old task draining
          # against the target group's 300s deregistration delay. On 2026-08-20 it
          # timed out 34 seconds before a healthy deploy completed, failing the run
          # red while the new code was already serving. One retry doubles the
          # budget to 20 minutes; the poll step below remains the real pass/fail
          # decision on rolloutState, so this cannot mask a genuine rollback.
          aws ecs wait services-stable --cluster default --services heimdall-api ||
            aws ecs wait services-stable --cluster default --services heimdall-api

      - name: Verify the rollout completed and did not roll back
        if: inputs.mode != 'build-only'
        run: |
          # POLL, don't snapshot. `aws ecs wait services-stable` returns once its
          # own condition is met, but ECS keeps rolloutState=IN_PROGRESS while the
          # superseded task set drains connections (the target group's
          # deregistration delay, 300s by default). Reading the state once lands in
          # that gap and fails a completely healthy deploy — which is what happened
          # on 2026-07-30: rollout COMPLETED moments later, new code already
          # serving, workflow red.
          #
          # A verification step that cries wolf is worse than no step at all: it
          # trains you to wave through the red X that means a genuine rollback.
          for i in $(seq 1 40); do
            STATE=$(aws ecs describe-services --cluster default --services heimdall-api \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' --output text)
            RUNNING=$(aws ecs describe-services --cluster default --services heimdall-api \
              --query 'services[0].deployments[?status==`PRIMARY`].runningCount' --output text)
            echo "attempt $i: rolloutState=$STATE runningCount=$RUNNING"
            # FAILED is terminal (ECS rolled back) — fail fast, don't wait it out.
            [ "$STATE" = "FAILED" ] && break
            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" -ge 1 ]; then
              echo "rollout verified"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployment did not complete (state=$STATE running=$RUNNING). Recent events:"
          aws ecs describe-services --cluster default --services heimdall-api \
            --query 'services[0].events[0:10].message' --output text
          exit 1

      - name: Probe the live API
        if: inputs.mode != 'build-only'
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            https://api.heimdallclaims.com/healthz)
          echo "healthz=$CODE"
          [ "$CODE" = "200" ] || { echo "::error::Health probe returned $CODE"; exit 1; }
          # /healthz deliberately does NOT touch the database, so a 200 here proves
          # the process is up — not that it can serve a request. If this deploy
          # carried a migration, confirm a real authenticated page loads too.

      - name: Summary
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            if [ "$MODE" = "build-only" ]; then
              echo "### Image pushed — service NOT restarted"
              echo ""
              echo "- commit: \`${{ github.sha }}\`"
              echo "- actor: @${{ github.actor }}"
              echo "- the service is still running the PREVIOUS image"
              echo ""
              echo "**Next:** run **migrate-db**, then re-run this workflow with"
              echo "\`mode=deploy-only\`. Do it now, not later — \`:latest\` is already"
              echo "the new image, so an unplanned task restart would pick it up."
            elif [ "$MODE" = "deploy-only" ]; then
              echo "### Restarted onto the image already in ECR"
              echo ""
              echo "- workflow ref: \`${{ github.sha }}\` (see the image digest above"
              echo "  for what actually shipped)"
              echo "- actor: @${{ github.actor }}"
              echo "- verified: ECS rollout COMPLETED, task running, /healthz 200"
            else
              echo "### Deployed to production"
              echo ""
              echo "- commit: \`${{ github.sha }}\`"
              echo "- actor: @${{ github.actor }}"
              echo "- verified: ECS rollout COMPLETED, task running, /healthz 200"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
