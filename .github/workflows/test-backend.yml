name: test-backend

# Runs on every backend change. Deliberately holds NO AWS credentials and cannot
# deploy: committing is not deploying. Shipping is a separate, manual decision —
# see deploy-backend.yml, which calls this workflow first.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration tests. Without TEST_DATABASE_URL
    # they skip, so the concurrency guarantees would go unverified — the claim
    # race and the updated_at trigger cannot be tested any other way.
    services:
      postgres:
        image: postgres:18 # match prod RDS major (18.x)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heimdall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install (editable, with dev tools)
        working-directory: backend
        # Editable so the installed `app` points at the source tree — otherwise a
        # second copy lands in site-packages and pytest hits an import-file mismatch.
        # ruff/black pinned to the SAME versions as .pre-commit-config.yaml so CI
        # and the hook can never disagree; bump both together (pre-commit autoupdate).
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --no-deps -e '.[dev]'
          pip install pytest pytest-asyncio ruff==0.15.17 black==26.5.1
      - name: Lint, format check, tests
        working-directory: backend
        env:
          # Integration tests run migrations against this and speak no TLS (the
          # service container has no certificate); the app engine is untouched.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/heimdall_test
          # Synthetic, for migration 0007's role creation. Alphanumeric — the
          # migration rejects anything else. Never a real credential.
          APP_DB_PASSWORD: citestonlynotarealsecret
        run: |
          ruff check .
          black --check .
          pytest -q

  # The de-identification NER path (Presidio + spaCy, backend/deid.lock) is the
  # export task's production default, and the main job above never installs
  # it — those tests skip there. This job installs the hash-pinned closure and
  # sets REQUIRE_DEID_TESTS so a missing Presidio FAILS instead of skipping.
  deid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install (image closure + deid closure)
        working-directory: backend
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --require-hashes --no-deps --only-binary=:all: --disable-pip-version-check -r deid.lock
          pip install --no-deps -e '.[dev]'
          pip install pytest pytest-asyncio
      - name: De-identification tests with NER
        working-directory: backend
        env:
          REQUIRE_DEID_TESTS: "1"
        run: pytest -q app/tests/scripts/test_deidentify.py
