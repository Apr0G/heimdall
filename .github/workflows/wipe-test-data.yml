name: wipe-test-data

# ☢️ IRREVERSIBLE (short of RDS point-in-time restore): deletes EVERY case,
# document, extraction, analysis, letter, model_run and outcome across ALL
# practices — i.e. the entire training corpus — plus their S3 objects. Keeps
# only users, practices, and the append-only audit_logs. Not scoped to "test".
# Export the corpus first (export-corpus workflow) if you might want the data.
#
# Two-key guard: the typed phrase below, AND `expected_cases` must equal the live
# case count or the script aborts before deleting anything. The second key is the
# one that carries weight — WIPE_CONFIRM is a constant hardcoded into the
# container override, so it proves intent about the workflow, not about the
# target. Having to state the row count means having to go and look at the
# database you are about to empty.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: ERASE-ALL-PRODUCTION-DATA'
        required: true
        default: ''
      expected_cases:
        description: "How many cases you expect to destroy (check the dashboard first)"
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  wipe:
    runs-on: ubuntu-latest
    # NOT an approval gate — read this before relying on it.
    #
    # Deployment protection rules (required reviewers, wait timer) are NOT
    # available on GitHub Pro for a private repository; they need Team or
    # Enterprise, which needs an organisation. Verified 2026-07-30: both the UI
    # section and the REST API refuse, with Pro confirmed active.
    #
    # What this line DOES give: a deployment record in the Environments tab, so
    # every dispatch is attributable — useful for HIPAA change control — and the
    # gate becomes one checkbox if this repo ever moves to an org. The OIDC trust
    # policy in ecs-express.tf accepts this environment's `sub` claim alongside
    # `ref:refs/heads/main`, so it costs nothing to keep.
    #
    # The binding controls today are the typed phrase and the live row-count
    # match. Note that neither stops someone with repo write, who can simply edit
    # the guards away — they protect against MISTAKES, not against an attacker.
    # Account 2FA is what protects against the attacker.
    environment: production-destructive
    steps:
      - name: Check confirmation
        # Inputs come in via env:, never interpolated straight into the script —
        # `${{ inputs.x }}` is substituted BEFORE the shell parses the line, so a
        # crafted value would be executed as shell. Same pattern as
        # deploy-backend.yml.
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_CASES: ${{ inputs.expected_cases }}
        run: |
          if [ "$CONFIRM" != "ERASE-ALL-PRODUCTION-DATA" ]; then
            echo "Confirmation failed — type exactly ERASE-ALL-PRODUCTION-DATA to proceed."
            echo "This deletes the entire training corpus across all practices."
            exit 1
          fi
          case "$EXPECTED_CASES" in
            ''|*[!0-9]*)
              echo "expected_cases must be a non-negative integer — the number of"
              echo "cases you expect to destroy. Check the dashboard first."
              exit 1
              ;;
          esac

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - name: Run the wipe as a one-off ECS task
        env:
          EXPECTED_CASES: ${{ inputs.expected_cases }}
        run: |
          set -euo pipefail
          CLUSTER=default
          # Runs on the DISPOSE task definition, not the API one.
          #
          # The bucket is versioned, so genuinely destroying an object needs
          # s3:DeleteObjectVersion + s3:ListBucketVersions. The app task role has
          # neither — only s3:DeleteObject, which on a versioned bucket just writes
          # a delete marker. That is why this workflow used to report destroying
          # objects that remained fully retrievable, and why it started failing
          # outright once the script was corrected to delete by VersionId.
          #
          # heimdall-dispose already carries exactly those permissions (it is the
          # BAA-offboarding role) plus the limited heimdall_app DB URL, which can
          # delete case rows but cannot touch audit_logs. Reusing it keeps the
          # destroy capability in the ONE role scoped for it, instead of granting
          # version-deletion to the app role — where an RCE in the running API
          # would inherit it. The container command is overridden below.
          TASKDEF=heimdall-dispose

          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TASKDEF" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)
          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=default-heimdall-api-$VPC" "Name=vpc-id,Values=$VPC" \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER\",\"command\":[\"python\",\"-m\",\"app.scripts.wipe_test_data\"],\"environment\":[{\"name\":\"WIPE_CONFIRM\",\"value\":\"WIPE\"},{\"name\":\"WIPE_EXPECT_CASES\",\"value\":\"$EXPECTED_CASES\"}]}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started wipe task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "wipe container exit code: $EXIT ($REASON)"
          test "$EXIT" = "0"
