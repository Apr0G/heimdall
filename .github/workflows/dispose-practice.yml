name: dispose-practice

# Destroys ONE practice's PHI for BAA offboarding: its cases + case-family rows and
# every S3 object version under practices/<id>/ and its model_runs/ archives. Keeps
# audit_logs (activity record) and the practice/user rows. IRREVERSIBLE.
# Guard: `practice_id` and `confirm` must be the SAME practice UUID.
on:
  workflow_dispatch:
    inputs:
      practice_id:
        description: "Practice UUID to destroy PHI for"
        required: true
      confirm:
        description: "Re-type the SAME practice UUID to confirm"
        required: true
      expected_cases:
        description: "How many cases you expect this practice to have (bind the confirmation to the target)"
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  dispose:
    runs-on: ubuntu-latest
    # NOT an approval gate — see the full note in wipe-test-data.yml. Protection
    # rules need GitHub Team/Enterprise, not Pro. This gives a deployment record
    # for attribution, and the OIDC trust policy accepts its `sub` claim.
    environment: production-destructive
    steps:
      - name: Check confirmation
        # Inputs via env:, never interpolated straight into the script — `${{ }}`
        # is substituted before the shell parses the line.
        env:
          PID: ${{ inputs.practice_id }}
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_CASES: ${{ inputs.expected_cases }}
        run: |
          if [ "$PID" != "$CONFIRM" ]; then
            echo "Confirmation failed — practice_id and confirm must match exactly."
            exit 1
          fi
          case "$PID" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]-*-*-*-*) ;;
            *) echo "practice_id must be a UUID."; exit 1 ;;
          esac
          case "$EXPECTED_CASES" in
            ''|*[!0-9]*)
              echo "expected_cases must be a non-negative integer — how many cases"
              echo "this practice currently has. The script aborts if it disagrees."
              exit 1
              ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - name: Run disposal as a one-off ECS task
        env:
          PID: ${{ inputs.practice_id }}
          EXPECTED_CASES: ${{ inputs.expected_cases }}
        run: |
          set -euo pipefail
          CLUSTER=default
          TASKDEF=heimdall-dispose

          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=default-heimdall-api-$VPC" "Name=vpc-id,Values=$VPC" \
            --query 'SecurityGroups[0].GroupId' --output text)

          OVERRIDES=$(cat <<JSON
          {"containerOverrides":[{"name":"dispose","environment":[
            {"name":"PRACTICE_ID","value":"$PID"},
            {"name":"DISPOSE_CONFIRM","value":"$PID"},
            {"name":"DISPOSE_EXPECT_CASES","value":"$EXPECTED_CASES"}
          ]}]}
          JSON
          )

          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started disposal task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "disposal container exit code: $EXIT ($REASON)"
          test "$EXIT" = "0"
