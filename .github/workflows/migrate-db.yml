name: migrate-db

# Runs `alembic upgrade head` against the private database as a one-off ECS task
# inside the VPC (the founder's laptop can no longer reach RDS directly). Manual
# trigger only. Keyless via GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running alembic upgrade head against production'
        required: true
        default: ""
      reason:
        description: "Why (recorded in the run + deployment record)"
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Deployment record for attribution; the OIDC trust policy accepts this subject.
    environment: production-destructive
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$CONFIRM" != "migrate" ]; then echo 'Type "migrate" to confirm.'; exit 1; fi
          if [ -z "$REASON" ]; then echo "A reason is required."; exit 1; fi
          echo "Reason: $REASON"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - name: Run alembic upgrade head as a one-off ECS task
        run: |
          set -euo pipefail
          CLUSTER=default
          # Dedicated migrate task def: owner DB creds (heimdall_admin) + APP_DB_PASSWORD
          # for migration 0007. Its default command is `alembic upgrade head`.
          TASKDEF=heimdall-migrate

          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=default-heimdall-api-$VPC" "Name=vpc-id,Values=$VPC" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "taskdef=$TASKDEF sg=$SG"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migration container exit code: $EXIT ($REASON)"
          test "$EXIT" = "0"
