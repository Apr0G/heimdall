name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-audit:
    name: Backend deps + SAST (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pip-audit bandit
      - name: pip-audit (known CVEs in installed deps)
        run: pip-audit --strict
      - name: bandit (Python SAST, medium+ severity)
        run: bandit -r backend/app -ll -ii

  frontend-audit:
    name: Frontend deps + lint (npm audit, eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm ci
      - name: npm audit (high+)
        run: cd frontend && npm audit --audit-level=high
      - name: eslint
        run: cd frontend && npm run lint

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  sast:
    name: Semgrep (multi-language SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + run semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/ci --config p/secrets --error --quiet
