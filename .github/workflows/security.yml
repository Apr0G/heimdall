name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-audit:
    name: Backend deps + SAST (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same interpreter as the image (backend/Dockerfile) so the audited
          # dependency closure is the one that actually ships.
          python-version: "3.11"
      - name: Install backend (from the hash-pinned lock) + audit tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r backend/requirements.lock
          pip install --no-deps -e ./backend
          # Pinned so the gate's own behaviour doesn't drift between runs.
          pip install pip-audit==2.10.1 bandit==1.9.4
      - name: pip-audit (known CVEs in installed deps)
        # --skip-editable: don't try to look up our own local package on PyPI.
        # PYSEC-2026-1325: ecdsa timing side-channel, transitive via python-jose,
        # with NO fixed release (0.19.2 is the latest). Not exploitable here —
        # Cognito issues RS256 (RSA) JWTs so the ECDSA verify path isn't used, and
        # the attack needs local timing measurement. Re-check when a fix ships.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325
      - name: pip-audit (corpus-export de-id closure, backend/deid.lock)
        # deid.lock is a SEPARATE hash-pinned closure (Presidio + spaCy + torch +
        # transformers) baked into the `deid` image stage for the corpus export
        # and promote tasks, so the audit above — which only sees what is
        # installed here — never covers it. Audited from the file, not an
        # install: --no-deps --disable-pip reads exactly the pins listed (the
        # lock is a complete closure, so nothing is missing), and
        # --require-hashes refuses any line that lost its hash. The two spaCy
        # model URLs have no advisory feed and torch is the +cpu build from the
        # PyTorch index (not on PyPI); pip-audit reports those three as skipped,
        # which is not a failure.
        run: pip-audit -r backend/deid.lock --require-hashes --no-deps --disable-pip
      - name: bandit (Python SAST, medium+ severity)
        run: bandit -r backend/app -ll -ii

  frontend-audit:
    name: Frontend deps + lint (npm audit, eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm ci
      - name: npm audit (production deps, high+)
        # Gate on vulnerabilities that actually ship to users (--omit=dev). Dev-only
        # tooling advisories with no non-breaking fix — e.g. brace-expansion via
        # eslint/@typescript-eslint, a lint-time ReDoS that never enters the prod
        # bundle — would otherwise wedge CI on an unavoidable transitive dep whose
        # only "fix" is a breaking eslint major. Mirrors the documented
        # pip-audit --ignore-vuln exception on the backend.
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: eslint
        run: cd frontend && npm run lint

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          # MUST match .pre-commit-config.yaml. When these drifted (CI on 8.21.2,
          # local on 8.30.1) the two ran different rulesets, so "clean locally"
          # and "clean in CI" were answering different questions.
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          # Download, VERIFY, then extract. Piping curl straight into tar executes
          # whatever the endpoint returns — for the tool whose whole job is
          # catching leaked credentials.
          curl -sSfL "$URL" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  sast:
    name: Semgrep (multi-language SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install + run semgrep
        # Scanned against app code (secrets are covered by the gitleaks job).
        run: |
          pip install semgrep==1.174.0
          semgrep scan --config p/python --config p/typescript backend/app frontend/src --error --quiet
