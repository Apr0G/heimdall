name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-audit:
    name: Backend deps + SAST (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pip-audit bandit
      - name: pip-audit (known CVEs in installed deps)
        # --skip-editable: don't try to look up our own local package on PyPI.
        # PYSEC-2026-1325: ecdsa timing side-channel, transitive via python-jose,
        # with NO fixed release (0.19.2 is the latest). Not exploitable here —
        # Cognito issues RS256 (RSA) JWTs so the ECDSA verify path isn't used, and
        # the attack needs local timing measurement. Re-check when a fix ships.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325
      - name: bandit (Python SAST, medium+ severity)
        run: bandit -r backend/app -ll -ii

  frontend-audit:
    name: Frontend deps + lint (npm audit, eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm ci
      - name: npm audit (production deps, high+)
        # Gate on vulnerabilities that actually ship to users (--omit=dev). Dev-only
        # tooling advisories with no non-breaking fix — e.g. brace-expansion via
        # eslint/@typescript-eslint, a lint-time ReDoS that never enters the prod
        # bundle — would otherwise wedge CI on an unavoidable transitive dep whose
        # only "fix" is a breaking eslint major. Mirrors the documented
        # pip-audit --ignore-vuln exception on the backend.
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: eslint
        run: cd frontend && npm run lint

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  sast:
    name: Semgrep (multi-language SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + run semgrep
        # Scanned against app code (secrets are covered by the gitleaks job).
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/typescript backend/app frontend/src --error --quiet
