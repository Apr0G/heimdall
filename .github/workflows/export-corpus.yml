name: export-corpus

# Exports a DE-IDENTIFIED training corpus (case -> extraction -> analysis -> letter
# -> outcome) as JSONL to s3://<bucket>/exports/, as a one-off in-VPC ECS task.
# Keyless via GitHub OIDC. The redacted file is NOT surfaced in this log — download
# it with your own admin creds. With ner=true, Presidio (installed at runtime, not
# baked into the app image) adds NER name/location detection over the regex passes.
on:
  workflow_dispatch:
    inputs:
      ner:
        description: "Use Presidio NER for name detection (slower, higher assurance)?"
        type: choice
        options: ["true", "false"]
        default: "true"
      include_doc_text:
        description: "Embed the (redacted) raw extracted document text?"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::000000000000:role/heimdall-gha-deploy
          aws-region: us-east-1

      - name: Export the corpus as a one-off ECS task
        env:
          INCLUDE: ${{ inputs.include_doc_text }}
          NER: ${{ inputs.ner }}
        run: |
          set -euo pipefail
          CLUSTER=default
          TASKDEF=default-heimdall-api

          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TASKDEF" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)
          BUCKET=$(aws ecs describe-task-definition --task-definition "$TASKDEF" \
            --query "taskDefinition.containerDefinitions[0].environment[?name=='S3_BUCKET_NAME'].value | [0]" \
            --output text)
          VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=default-heimdall-api-$VPC" "Name=vpc-id,Values=$VPC" \
            --query 'SecurityGroups[0].GroupId' --output text)

          INC=$([ "$INCLUDE" = "true" ] && echo 1 || echo 0)
          if [ "$NER" = "true" ]; then
            USE_NER=1
            # Hash-verified install (backend/deid.lock). Every artifact
            # in the transitive closure, plus the spaCy model, must match a recorded
            # sha256 or the install FAILS — so a compromised or typosquatted release
            # cannot execute code inside a task that holds DATABASE_URL and the app
            # task role. --no-deps because the file already pins the full closure;
            # --only-binary and --disable-pip-version-check keep pip from doing
            # anything else on the network.
            CMD='["sh","-c","pip install --require-hashes --no-deps --only-binary=:all: --disable-pip-version-check -r deid.lock && python -m app.scripts.export_corpus"]'
          else
            USE_NER=0
            CMD='["python","-m","app.scripts.export_corpus"]'
          fi

          OVERRIDES=$(cat <<JSON
          {"containerOverrides":[{"name":"$CONTAINER",
            "command":$CMD,
            "environment":[
              {"name":"INCLUDE_DOC_TEXT","value":"$INC"},
              {"name":"USE_NER","value":"$USE_NER"},
              {"name":"PIP_USER","value":"1"}
            ]}]}
          JSON
          )

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" --task-definition "$TASKDEF" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started export task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "export container exit code: $EXIT ($REASON)"
          test "$EXIT" = "0"

          echo ""
          echo "Corpus written to s3://$BUCKET/exports/ . Download with your OWN admin creds:"
          echo "  aws s3 ls s3://$BUCKET/exports/"
          echo "  aws s3 cp s3://$BUCKET/exports/<file>.jsonl ."
