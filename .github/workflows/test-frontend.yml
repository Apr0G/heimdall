name: test-frontend

# Runs on every frontend change: type-check + the vitest suite (login state
# machine, auth context, settings). No credentials, cannot deploy.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Type-check
        run: cd frontend && npx tsc --noEmit -p .
      - name: Test
        run: cd frontend && npm test
