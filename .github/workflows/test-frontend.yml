name: test-frontend

# Runs on every frontend change: type-check + the vitest suite (login state
# machine, auth context, settings). No credentials, cannot deploy.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Type-check
        run: cd frontend && npx tsc --noEmit -p .
      - name: Test
        run: cd frontend && npm test
      - name: Production build
        # A dependency bump can pass tsc + vitest and still break the compile;
        # without this the failure only surfaces on Vercel's build of main.
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.heimdallclaims.com
