[project]
name = "heimdall-backend"
version = "0.1.0"
description = "Heimdall backend — AI-assisted insurance claim appeal automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",       # 2.14.2 fixes GHSA-4xgf-cpjx-pc3j
    "boto3>=1.34",
    "python-jose[cryptography]>=3.4",  # verify Cognito RS256 JWTs; 3.4 fixes CVE-2024-33663/33664
    "httpx>=0.27",
    "python-multipart>=0.0.9",         # FastAPI form/multipart parsing
    "pypdf>=6.13.3",                   # detect digital vs scanned PDFs; 6.13.3 fixes GHSA-jm82-fx9c-mx94
    "pdfplumber>=0.11",                # word positions for in-place CMS-1500 edits (services/claim_patch.py); MIT, unlike AGPL PyMuPDF
    "slowapi>=0.1.9",                  # layered rate limiting (security hardening)
    "redis>=5.0",                      # rate-limit storage backend (prod; in-memory in dev)
    "setuptools>=83",                  # not imported; floors the interpreter's copy past PYSEC-2026-3447 so the lock (and pip-audit) cover it
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are intentionally called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

# Runtime dependencies are installed from requirements.lock (hash-pinned,
# resolved for py3.11/linux — see Dockerfile). After editing `dependencies`
# above, refresh it with:
#   uv pip compile --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#     --generate-hashes --no-strip-extras -o requirements.lock pyproject.toml
