# Pinned, hash-verified dependency set for the corpus de-identification detectors
# (Presidio + spaCy + the clinical transformer stack: torch CPU, transformers),
# baked into the `deid` image stage
# (backend/Dockerfile) and installed by the CI deid job. Used ONLY by the
# export-corpus / promote-corpus ECS tasks — nothing in the API request path
# imports any of it.
#
# NAMED deid.lock, NOT requirements-*.txt, ON PURPOSE: this is a complete
# `--no-deps` closure, so every pin must move together (pydantic-core must match
# pydantic exactly, thinc must match spaCy, tokenizers must match transformers).
# Dependabot scans requirements* files and was opening single-package bumps
# against it, each of which would have broken the install at import time.
# Regenerate the whole file (see below) — never bump one line.
#
# SHARED PINS MUST MATCH requirements.lock. The deid stage is built FROM the api
# stage, so a package listed here at a different version than requirements.lock
# silently replaces the audited baseline inside a PHI-holding task.
# tests/test_dependency_locks.py fails when the two disagree; the resolver below
# is run with requirements.lock as a constraints file so they cannot.
#
# WHY HASH-PINNED
# ---------------
# `pip install --require-hashes --no-deps --only-binary=:all:` makes the install
# reproducible and tamper-evident: every artifact in the transitive closure,
# plus both spaCy model wheels, must match a sha256 recorded here. A substituted
# or backdoored wheel fails the build instead of running inside a container that
# holds DATABASE_URL and the export task role. The transformer WEIGHTS are pinned
# separately, by revision and per-file sha256, in deid-model.json.
#
# torch is the CPU build from the PyTorch index (no CUDA libraries, ~200 MB
# instead of ~2 GB) — hence the --extra-index-url below, which pip honours in a
# requirements file. pip-audit cannot audit a +cpu local version (not on PyPI)
# and reports it as skipped; the code is the same release as PyPI's torch.
# transformers is 5.x: Presidio's native HuggingFaceNerRecognizer drives the
# model directly, so the spacy-huggingface-pipelines bridge (which pins
# transformers <5, a version line with open advisories) is not needed.
#
# HOW TO REGENERATE
# -----------------
# Resolved for the CONTAINER's platform (linux/amd64, CPython 3.11), not a laptop:
#
#     cd backend
#     grep -oE '^[A-Za-z0-9_.-]+==[^ \\]+' requirements.lock > /tmp/constraints.txt
#     cat > /tmp/deid.in <<'IN'
#     presidio-analyzer==2.2.364
#     transformers>=5.17
#     torch
#     huggingface-hub
#     en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
#     en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
#     IN
#     uv pip compile --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#       --generate-hashes --no-strip-extras --index-url https://pypi.org/simple \
#       --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
#       -c /tmp/constraints.txt /tmp/deid.in -o /tmp/deid.lock
#
# then paste the resolved body under this header, keeping the --extra-index-url line.

--extra-index-url https://download.pytorch.org/whl/cpu

